name: Sync to Second Repo

on:
  push:
    branches:
      - main # Altere para a branch principal do seu projeto (ex: master, develop)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

      - name: Push to second repo
        run: |
          git remote add second https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/espacomulti93-cpu/espaco-multi.git
          git push second HEAD:main --force # Use --force se quiser sobrescrever completamente, ou remova se quiser manter histórico separado   
